<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101722">
<link rel="manifest" href="manifest.webmanifest">
<title>MARBLE LAB 3D</title>
<style>
:root{color-scheme:dark;--bg:#101722;--panel:#1b2735;--line:#344457;--txt:#edf4fb;--muted:#a9b9c9;--accent:#78d5cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;touch-action:none}canvas{display:block}
header{position:fixed;top:0;left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;background:linear-gradient(#101722dd,transparent)}
h1{font-size:15px;letter-spacing:.16em;margin:0}header small{color:var(--muted);font-size:10px;letter-spacing:.08em}
.panel{position:fixed;left:10px;right:10px;bottom:10px;background:#172331eF;border:1px solid var(--line);border-radius:18px;padding:12px;backdrop-filter:blur(12px);box-shadow:0 12px 36px #0006}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row+.row{margin-top:9px}
button,select{background:#26384a;color:var(--txt);border:1px solid #42576b;border-radius:11px;padding:10px 12px;font-size:13px}
button:active{transform:scale(.97)}button.primary{background:#286b70;border-color:#4ba6a0}button.active{outline:2px solid var(--accent)}
select{flex:1;min-width:120px}.hint{font-size:11px;color:var(--muted);margin-top:8px}
#count{margin-left:auto;color:var(--accent);font-size:12px}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#26384a;padding:8px 14px;border-radius:20px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}
@media(min-width:700px){.panel{max-width:560px;left:50%;right:auto;width:calc(100% - 24px);transform:translateX(-50%)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
</head>
<body>
<div id="scene"></div>
<header><div><h1>MARBLE LAB <span style="color:#78d5cf">3D</span></h1><small>PHYSICS PLAYGROUND</small></div><small>DRAG TO ROTATE · PINCH TO ZOOM</small></header>
<div id="toast"></div>
<section class="panel">
 <div class="row">
  <select id="material" aria-label="素材">
   <option value="glass">ガラス玉</option><option value="steel">スチール</option><option value="wood">木</option><option value="rubber">ゴム</option><option value="stone">大理石</option><option value="plastic">プラスチック</option>
  </select>
  <button class="primary" id="drop">＋ 落とす</button><button id="rain">大量投入</button>
  <span id="count">0 / 100</span>
 </div>
 <div class="row">
  <button id="tilt">坂を傾ける</button><button id="kick">ゆらす</button><button id="pause">一時停止</button><button id="reset">リセット</button>
 </div>
 <div class="hint">画面をタップするとその位置に玉を追加。玉をドラッグして投げられます。素材ごとに重さ・反発・摩擦が変わります。</div>
</section>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
const root=document.querySelector('#scene'), toastEl=document.querySelector('#toast');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x101722); scene.fog=new THREE.Fog(0x101722,18,38);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(8,8,12);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc8e5ff,0x27303c,2));
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-5,12,7);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});world.broadphase=new CANNON.SAPBroadphase(world);world.allowSleep=true;
world.defaultContactMaterial.friction=.35;world.defaultContactMaterial.restitution=.35;
const matDefs={
 glass:{color:0x8bdde8,mass:.75,friction:.08,bounce:.82,metal:0,rough:.08,trans:.48},
 steel:{color:0xb7c5d3,mass:2.8,friction:.22,bounce:.42,metal:.85,rough:.24},
 wood:{color:0xb77942,mass:1.3,friction:.55,bounce:.18,metal:0,rough:.82},
 rubber:{color:0x303844,mass:1.1,friction:.9,bounce:.92,metal:0,rough:.92},
 stone:{color:0xaaa9a4,mass:2.4,friction:.48,bounce:.25,metal:0,rough:.72},
 plastic:{color:0xf0a6ce,mass:.55,friction:.28,bounce:.58,metal:.05,rough:.3}
};
const balls=[],staticBodies=[];let paused=false,tilted=false,dragging=null,down=null;
const floorMat=new CANNON.Material('floor');const floorContact=new CANNON.ContactMaterial(floorMat,world.defaultMaterial,{friction:.48,restitution:.3});world.addContactMaterial(floorContact);
function box(w,h,d,x,y,z,color,rotation=0){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.68,metalness:.08}));mesh.position.set(x,y,z);mesh.rotation.z=rotation;mesh.receiveShadow=true;mesh.castShadow=true;scene.add(mesh);const body=new CANNON.Body({mass:0,material:floorMat,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)),position:new CANNON.Vec3(x,y,z)});body.quaternion.setFromEuler(0,0,rotation);world.addBody(body);staticBodies.push({mesh,body});return {mesh,body};}
box(12,.5,9,0,-.35,0,0x344c5d);
box(12,.6,.35,0,.05,-4.5,0x567083);box(12,.6,.35,0,.05,4.5,0x567083);box(.35,.6,9,-6,.05,0,0x567083);box(.35,.6,9,6,.05,0,0x567083);
for(let i=0;i<5;i++)box(.18,.9,7,-3.8+i*1.9,.35,0,0x263b4d,0);
const grid=new THREE.GridHelper(12,24,0x567083,0x2b3c4c);grid.position.y=-.08;scene.add(grid);
function addBall(x= (Math.random()-.5)*3,y=5+Math.random()*2,z=(Math.random()-.5)*3){
 if(balls.length>=100){notify('上限100個です');return}
 const key=document.querySelector('#material').value,d=matDefs[key],r=.28+Math.random()*.08;
 const material=new THREE.MeshPhysicalMaterial({color:d.color,metalness:d.metal??0,roughness:d.rough,clearcoat:key==='glass'?.9:.15,transmission:d.trans??0,thickness:.7,ior:1.45});
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,32,24),material);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
 const body=new CANNON.Body({mass:d.mass,material:new CANNON.Material(key),shape:new CANNON.Sphere(r),position:new CANNON.Vec3(x,y,z),linearDamping:.015,angularDamping:.02});body.velocity.set((Math.random()-.5)*1.4,0,(Math.random()-.5)*1.4);
 body.addEventListener('collide',()=>{if(navigator.vibrate)navigator.vibrate(8)});
 const cm=new CANNON.ContactMaterial(body.material,floorMat,{friction:d.friction,restitution:d.bounce});world.addContactMaterial(cm);world.addBody(body);balls.push({mesh,body});count();
}
function count(){document.querySelector('#count').textContent=`${balls.length} / 100`}
function notify(t){toastEl.textContent=t;toastEl.style.opacity=1;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastEl.style.opacity=0,1400)}
document.querySelector('#drop').onclick=()=>addBall();
document.querySelector('#rain').onclick=()=>{for(let i=0;i<24;i++)addBall((Math.random()-.5)*4,7+Math.random()*5,(Math.random()-.5)*4)};
document.querySelector('#tilt').onclick=()=>{tilted=!tilted;staticBodies[0].body.quaternion.setFromEuler(0,0,tilted?-.16:0);staticBodies[0].mesh.rotation.z=tilted?-.16:0;notify(tilted?'坂を傾けました':'水平に戻しました')};
document.querySelector('#kick').onclick=()=>{balls.forEach(({body})=>body.applyImpulse(new CANNON.Vec3((Math.random()-.5)*4,2+Math.random()*3,(Math.random()-.5)*4),body.position));notify('振動！')};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再開':'一時停止'};
document.querySelector('#reset').onclick=()=>{balls.forEach(({mesh,body})=>{scene.remove(mesh);world.removeBody(body)});balls.length=0;count();notify('実験場をリセットしました')};
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-1.5),hit=new THREE.Vector3();
function pointerPos(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1}
renderer.domElement.addEventListener('pointerdown',e=>{pointerPos(e);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(balls.map(b=>b.mesh));if(hits.length){const m=hits[0].object;dragging=balls.find(b=>b.mesh===m);down={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)}});
renderer.domElement.addEventListener('pointerup',e=>{if(dragging){const dx=e.clientX-down.x,dy=e.clientY-down.y;dragging.body.velocity.set(dx*.035,Math.max(1,-dy*.035),0);dragging=null;down=null}});
let orbit={x:0,y:0};let last=null;
renderer.domElement.addEventListener('pointermove',e=>{if(dragging)return;if(e.buttons){if(!last)last={x:e.clientX,y:e.clientY};orbit.x+=(e.clientX-last.x)*.006;orbit.y+=(e.clientY-last.y)*.006;orbit.y=Math.max(-.3,Math.min(1.1,orbit.y));const radius=15;camera.position.set(Math.sin(orbit.x)*radius,4+orbit.y*7,Math.cos(orbit.x)*radius);camera.lookAt(0,1,0);last={x:e.clientX,y:e.clientY}}else last=null});
renderer.domElement.addEventListener('click',e=>{if(dragging)return;pointerPos(e);raycaster.setFromCamera(pointer,camera);if(raycaster.ray.intersectPlane(plane,hit)&&Math.abs(hit.x)<5.4&&Math.abs(hit.z)<3.8)addBall(hit.x,5,hit.z)});
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.033);prev=now;if(!paused)world.step(1/60,dt,3);for(const b of balls){b.mesh.position.copy(b.body.position);b.mesh.quaternion.copy(b.body.quaternion)}renderer.render(scene,camera)}requestAnimationFrame(animate);
addBall(0,5,0);addBall(1,7,0);addBall(-1,9,0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
